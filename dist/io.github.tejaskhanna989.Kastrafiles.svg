<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A1E5C"/>
      <stop offset="100%" stop-color="#181038"/>
    </linearGradient>

    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B9A6FF"/>
      <stop offset="100%" stop-color="#8E77F0"/>
    </linearGradient>

    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8C6BF2"/>
      <stop offset="55%" stop-color="#7350E6"/>
      <stop offset="100%" stop-color="#5B39CE"/>
    </linearGradient>

    <linearGradient id="frontTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A98BFF" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#A98BFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#0E0730" flood-opacity=".6"/>
    </filter>

    <filter id="contact" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="-8" stdDeviation="12" flood-color="#2A1560" flood-opacity=".5"/>
    </filter>
  </defs>

  <!-- app tile -->
  <rect x="48" y="48" width="928" height="928" rx="216" fill="url(#tile)"/>

  <g filter="url(#soft)">
    <!-- back sheet with folder tab -->
    <path
      d="M184 456
         L184 352
         C184 330 202 312 224 312
         L408 312
         C426 312 441 318 452 332
         L500 392
         C510 405 524 412 541 412
         L800 412
         C822 412 840 430 840 452
         L840 690
         C840 712 822 730 800 730
         L224 730
         C202 730 184 712 184 690
         Z"
      fill="url(#back)"/>

    <!-- front flap -->
    <g filter="url(#contact)">
      <path
        d="M184 470
           C184 448 202 430 224 430
           L800 430
           C822 430 840 448 840 470
           L840 690
           C840 712 822 730 800 730
           L224 730
           C202 730 184 712 184 690
           Z"
        fill="url(#front)"/>
    </g>

    <!-- top light on front flap -->
    <path
      d="M184 470
         C184 448 202 430 224 430
         L800 430
         C822 430 840 448 840 470
         L840 512
         L184 512
         Z"
      fill="url(#frontTop)"/>
  </g>
</svg>
