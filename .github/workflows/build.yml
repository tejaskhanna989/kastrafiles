name: Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_ID: io.github.tejaskhanna989.Kastrafiles

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Ubuntu: build + test, then produce the AppImage, .deb and .rpm.
  # ─────────────────────────────────────────────────────────────────────
  build-linux:
    name: Linux (AppImage / .deb / .rpm)
    runs-on: ubuntu-24.04
    env:
      # Produce distributable packages on main / tags / manual runs, but only
      # compile + test on pull requests (keeps PR feedback fast).
      SHOULD_PACKAGE: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify version consistency (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          TAG="$TAG_NAME"
          VERSION="${TAG#v}"
          echo "Tag push: $TAG (version $VERSION)"

          fail=0
          check() {
            local label="$1" expected="$2" found="$3"
            if [ "$expected" != "$found" ]; then
              echo "::error::$label mismatch: expected '$expected', found '$found'"
              fail=1
            else
              echo "OK   $label: $found"
            fi
          }

          cmake_ver=$(grep -E '^project\(kastrafiles VERSION' CMakeLists.txt \
                       | sed -E 's/^project\(kastrafiles VERSION ([0-9.]+).*/\1/')
          check "CMakeLists.txt" "$VERSION" "$cmake_ver"

          if grep -q "<release version=\"$VERSION\"" dist/io.github.tejaskhanna989.Kastrafiles.metainfo.xml; then
            echo "OK   metainfo.xml <release> entry present"
          else
            echo "::error::metainfo.xml is missing a <release version=\"$VERSION\"> entry"
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo
            echo "One or more version references do not match the pushed tag."
            echo "Run scripts/release.sh $VERSION locally, then retag."
            exit 1
          fi

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          # On Linux the Wayland platform plugin ships with the base Qt install;
          # we force linuxdeploy-plugin-qt to bundle it via EXTRA_PLATFORM_PLUGINS
          # further below (after building the matching QtWayland integration
          # plugins from source).
          modules: 'qtshadertools'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            libgl-dev \
            libxkbcommon-dev \
            libdbus-1-dev \
            libwayland-dev \
            libegl-dev \
            libgles-dev \
            libvulkan-dev \
            wayland-protocols \
            xdg-utils \
            file \
            libfuse2 \
            libglib2.0-dev \
            libglib2.0-bin \
            libargon2-dev \
            libssl-dev \
            psmisc \
            gvfs \
            dbus \
            p7zip-full \
            dpkg-dev \
            rpm

      - name: Build QtWayland from source
        if: env.SHOULD_PACKAGE == 'true'
        # aqtinstall's Linux Qt 6.7.3 omits the wayland-graphics-integration-client
        # plugins, so Qt can't find a client buffer integration at runtime and a
        # bundled AppImage aborts on Wayland. Build qtwayland from the matching
        # source tag against the aqt Qt so linuxdeploy-plugin-qt bundles it.
        run: |
          QT_PREFIX=$(qmake6 -query QT_INSTALL_PREFIX 2>/dev/null || qmake -query QT_INSTALL_PREFIX)
          echo "Qt prefix: $QT_PREFIX"
          git clone --depth 1 --branch v6.7.3 https://github.com/qt/qtwayland.git qtwayland-src
          cmake -S qtwayland-src -B qtwayland-src/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DCMAKE_INSTALL_PREFIX="$QT_PREFIX"
          cmake --build qtwayland-src/build --parallel
          cmake --install qtwayland-src/build
          echo "=== wayland-graphics-integration-client after install ==="
          ls "$QT_PREFIX/plugins/wayland-graphics-integration-client/" || true

      - name: Build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DKASTRAFILES_DATA_DIR=/usr/share/kastrafiles \
            -DKASTRAFILES_ENABLE_QML_CACHEGEN=ON
          cmake --build build --parallel

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          dbus-run-session -- ctest --test-dir build --output-on-failure --parallel 4 --timeout 300

      # ── .deb / .rpm via CPack ────────────────────────────────────────
      - name: Package .deb and .rpm (CPack)
        if: env.SHOULD_PACKAGE == 'true'
        run: |
          set -euo pipefail
          cd build
          cpack -G DEB
          cpack -G RPM
          cd ..
          ls -la build/*.deb build/*.rpm
          mkdir -p packages
          cp build/*.deb build/*.rpm packages/

      # ── AppImage ─────────────────────────────────────────────────────
      - name: Install into AppDir
        if: env.SHOULD_PACKAGE == 'true'
        run: |
          DESTDIR="$GITHUB_WORKSPACE/AppDir" cmake --install build

      - name: Download linuxdeploy and Qt plugin
        if: env.SHOULD_PACKAGE == 'true'
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20250213-2/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage
          printf '%s  %s\n' \
            '4648f278ab3ef31f819e67c30d50f462640e5365a77637d7e6f2ad9fd0b4522a' \
            'linuxdeploy-x86_64.AppImage' | sha256sum -c -
          printf '%s  %s\n' \
            '15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724' \
            'linuxdeploy-plugin-qt-x86_64.AppImage' | sha256sum -c -
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Build AppImage
        if: env.SHOULD_PACKAGE == 'true'
        env:
          TAG_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'continuous' }}
          # Force linuxdeploy-plugin-qt to bundle the Wayland platform plugin
          # alongside xcb; otherwise a GNOME/Hyprland Wayland session renders black.
          EXTRA_PLATFORM_PLUGINS: libqwayland-generic.so;libqwayland-egl.so
          QML_SOURCES_PATHS: src/qml
        run: |
          set -euo pipefail
          QT_PLUGIN_DIR=$(qmake6 -query QT_INSTALL_PLUGINS 2>/dev/null || qmake -query QT_INSTALL_PLUGINS)

          # Only SQLite is needed; remove unused SQL drivers that pull missing libs.
          if [ -d "$QT_PLUGIN_DIR/sqldrivers" ]; then
            find "$QT_PLUGIN_DIR/sqldrivers" -type f ! -name "libqsqlite.so" -delete || true
          fi

          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin qt \
            --desktop-file dist/io.github.tejaskhanna989.Kastrafiles.desktop \
            --icon-file dist/io.github.tejaskhanna989.Kastrafiles.svg

          deploy_deps_args=()
          for plugin_dir in \
            wayland-graphics-integration-client \
            wayland-shell-integration \
            wayland-decoration-client
          do
            if [ -d "$QT_PLUGIN_DIR/$plugin_dir" ]; then
              mkdir -p AppDir/usr/plugins
              rm -rf "AppDir/usr/plugins/$plugin_dir"
              cp -a "$QT_PLUGIN_DIR/$plugin_dir" "AppDir/usr/plugins/"
              deploy_deps_args+=(--deploy-deps-only "AppDir/usr/plugins/$plugin_dir")
              echo "Bundled extra Qt plugin dir: $plugin_dir"
            fi
          done

          scripts/prune-appdir.sh AppDir

          OUTPUT="Kastrafiles-${TAG_NAME}-x86_64.AppImage" \
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            "${deploy_deps_args[@]}" \
            --output appimage

          cp "Kastrafiles-${TAG_NAME}-x86_64.AppImage" "Kastrafiles-x86_64.AppImage"

      - name: Verify bundled Wayland client integrations
        if: env.SHOULD_PACKAGE == 'true'
        run: |
          test -d AppDir/usr/plugins/wayland-graphics-integration-client
          test -n "$(ls -A AppDir/usr/plugins/wayland-graphics-integration-client)"

      - name: Smoke-test AppImage
        if: env.SHOULD_PACKAGE == 'true'
        env:
          TAG_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'continuous' }}
        # Boot the AppImage on the offscreen QPA platform so any "is not a type"
        # / QML load failure aborts the release before it ships.
        run: |
          chmod +x "Kastrafiles-${TAG_NAME}-x86_64.AppImage"
          set +e
          QT_QPA_PLATFORM=offscreen QSG_RHI_BACKEND=software \
            timeout 10 "./Kastrafiles-${TAG_NAME}-x86_64.AppImage" \
            > smoke.stdout 2> smoke.stderr &
          SMOKE_PID=$!
          sleep 5
          kill -TERM $SMOKE_PID 2>/dev/null || true
          wait $SMOKE_PID 2>/dev/null || true
          set -e
          echo "=== smoke stdout ==="; cat smoke.stdout || true
          echo "=== smoke stderr ==="; cat smoke.stderr || true
          if grep -E "is not a type|failed to load component|QQmlApplicationEngine failed|TypeError:|Unable to assign|Aborted \(core dumped\)|Segmentation fault|Failed to initialize graphics backend|Failed to create RHI" smoke.stderr; then
            echo "Smoke test FAILED: AppImage cannot load its QML."
            exit 1
          fi
          echo "Smoke test passed."

      - name: Upload Linux artifacts
        if: env.SHOULD_PACKAGE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kastrafiles-linux
          path: |
            Kastrafiles-*.AppImage
            packages/*.deb
            packages/*.rpm
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────
  # Arch Linux: build + produce the .pkg.tar.zst.
  # ─────────────────────────────────────────────────────────────────────
  build-arch:
    name: Arch Linux (.pkg.tar.zst)
    runs-on: ubuntu-24.04
    container: archlinux:latest
    env:
      SHOULD_PACKAGE: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Install git (required by actions/checkout)
        run: |
          pacman -Syu --noconfirm --needed git

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel \
            cmake \
            ninja \
            gcc \
            qt6-base \
            qt6-declarative \
            qt6-svg \
            qt6-wayland \
            glib2 \
            argon2 \
            openssl \
            libglvnd \
            wayland \
            libxkbcommon \
            kwindowsystem \
            desktop-file-utils \
            shared-mime-info
      # bsdtar is provided by libarchive, a pacman hard dependency that is
      # always present — it is intentionally not listed above (naming it as a
      # target fails with "target not found").

      - name: Build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DKASTRAFILES_DATA_DIR=/usr/share/kastrafiles \
            -DKASTRAFILES_ENABLE_QML_CACHEGEN=ON \
            -DBUILD_TESTS=OFF
          cmake --build build --parallel

      - name: Package (.pkg.tar.zst)
        if: env.SHOULD_PACKAGE == 'true'
        run: |
          set -euo pipefail
          VERSION=$(grep -E '^project\(kastrafiles VERSION' CMakeLists.txt \
                    | sed -E 's/^project\(kastrafiles VERSION ([0-9.]+).*/\1/')
          PKGREL=1
          STAGE="$PWD/pkgstage"
          cmake --install build --prefix "$STAGE/usr"
          SIZE=$(du -sk "$STAGE" | cut -f1)
          cat > "$STAGE/.PKGINFO" <<EOF
          pkgname = kastrafiles
          pkgbase = kastrafiles
          pkgver = $VERSION-$PKGREL
          pkgdesc = A fast, modern Wayland file manager with Miller columns and a built-in secure vault
          url = https://github.com/tejaskhanna989/Kastrafiles
          builddate = $(date +%s)
          packager = Kastrafiles CI
          size = ${SIZE}K
          arch = x86_64
          license = GPL-3.0-or-later
          depend = glib2
          depend = gvfs
          depend = kwindowsystem
          depend = qt6-base
          depend = qt6-declarative
          depend = qt6-svg
          depend = qt6-wayland
          depend = xdg-utils
          depend = openssl
          depend = argon2
          EOF
          # Strip the indentation that YAML's block scalar preserved.
          sed -i 's/^[[:space:]]*//' "$STAGE/.PKGINFO"
          # Name entries explicitly: packing "." would store metadata as
          # "./.PKGINFO", which pacman rejects as "missing package metadata".
          bsdtar -czf "kastrafiles-$VERSION-$PKGREL-x86_64.pkg.tar.zst" -C "$STAGE" .PKGINFO usr
          # Validate the package parses before uploading it.
          pacman -Qp "kastrafiles-$VERSION-$PKGREL-x86_64.pkg.tar.zst"
          ls -la kastrafiles-*.pkg.tar.zst

      - name: Upload Arch artifact
        if: env.SHOULD_PACKAGE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kastrafiles-arch
          path: kastrafiles-*.pkg.tar.zst
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────
  # Publish a GitHub Release (tag or continuous) with all Linux installers.
  # ─────────────────────────────────────────────────────────────────────
  release:
    name: Release
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [build-linux, build-arch]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          # Download into a dedicated dir — NOT "dist", which already exists in
          # the checked-out tree and would otherwise leak repo metadata files
          # (.desktop/.svg/.metainfo/.policy) into the release assets.
          path: _artifacts
          merge-multiple: true

      - name: List downloaded installers
        run: find _artifacts -type f | sort

      - name: Prepare release notes
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          mkdir -p out
          # Flatten installer artifacts into out/
          find _artifacts -type f -exec cp -v {} out/ \;
          if [ "$IS_TAG" = "true" ]; then
            git fetch --force --no-tags origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" || true
            git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > release-notes.md || true
            if [ ! -s release-notes.md ]; then
              echo "Release ${GITHUB_REF_NAME}" > release-notes.md
            fi
          else
            cat <<EOF > release-notes.md
          ### Kastrafiles Continuous Build
          Automated pre-release build from branch \`main\` (commit \`${GITHUB_SHA:0:7}\`).

          #### Installers
          - **AppImage** (any distro): \`chmod +x Kastrafiles-continuous-x86_64.AppImage && ./Kastrafiles-continuous-x86_64.AppImage\`
          - **Debian/Ubuntu**: \`sudo apt install ./kastrafiles_*.deb\`
          - **Fedora/RHEL/openSUSE**: \`sudo dnf install ./kastrafiles-*.rpm\`
          - **Arch Linux**: \`sudo pacman -U ./kastrafiles-*.pkg.tar.zst\`
          EOF
          fi
          test -s release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'continuous' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Kastrafiles {0}', github.ref_name) || 'Kastrafiles Continuous Build' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: out/*
          body_path: release-notes.md
